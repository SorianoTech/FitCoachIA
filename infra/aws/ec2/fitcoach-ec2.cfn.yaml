AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FitCoachIA on a single EC2 instance: the same Docker Compose stack as the current server
  (app, embedder, PostgreSQL, pgVector, Nginx Proxy Manager and the project observability stack),
  deployed by GitHub Actions through SSM. See docs/despliegue-aws-ec2.md.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Network }
        Parameters: [VpcId, SubnetId]
      - Label: { default: Instance }
        Parameters: [ImageId, InstanceType, RootVolumeSize, SwapSize]
      - Label: { default: Deployment }
        Parameters: [GitHubRepository, GitHubEnvironment, GitHubOidcProviderArn]
      - Label: { default: Backups }
        Parameters: [BackupRetentionDays, SnapshotRetentionCount]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the instance (the default VPC is enough).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet of that VPC. Changing it replaces the instance.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu Server 24.04 LTS amd64 AMI. Pinned on purpose: changing it replaces the instance.
      Current one: aws ssm get-parameter --name
      /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge, m7i-flex.large, m7i-flex.xlarge]
    Description: t3.large (8 GB) for prod + observability; t3.xlarge (16 GB) to also host dev.
  RootVolumeSize:
    Type: Number
    Default: 60
    MinValue: 40
    Description: Root gp3 volume in GiB (images, PostgreSQL volumes, Prometheus/Loki/Tempo data).
  SwapSize:
    Type: String
    Default: 2G
    AllowedPattern: ^\d+G$
  GitHubRepository:
    Type: String
    Default: SorianoTech/FitCoachIA
    AllowedPattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
    Description: owner/repo whose deploy.yml may deploy, with the exact case shown by GitHub.
  GitHubEnvironment:
    Type: String
    Default: prod-aws
    AllowedPattern: ^[A-Za-z0-9_.-]+$
    Description: GitHub environment of the deploy job (environment in deploy.yml).
  GitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the account's existing token.actions.githubusercontent.com OIDC provider (only one per
      account). Empty: the stack creates it.
  BackupRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
  SnapshotRetentionCount:
    Type: Number
    Default: 7
    MinValue: 1

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref GitHubOidcProviderArn, ""]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FitCoachIA EC2 - HTTPS for Telegram and the Mini App
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Telegram webhook and Mini App }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: Telegram webhook and Mini App }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTPS redirect and Lets Encrypt HTTP-01 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0", Description: HTTPS redirect and Lets Encrypt HTTP-01 }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-sg" }

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-postgres-dumps
            Status: Enabled
            Prefix: postgres/
            ExpirationInDays: !Ref BackupRetentionDays

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager: shell and port forwarding (NPM admin, Grafana) without opening ports.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: postgres-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${BackupBucket.Arn}/postgres/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
        - PolicyName: release-files
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Files of each release, uploaded by deploy.yml.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${BackupBucket.Arn}/deploy/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      DisableApiTermination: true
      CreditSpecification: { CPUCredits: unlimited }
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            # Survives an accidental replacement: Docker volumes (PostgreSQL, Grafana...) live here.
            DeleteOnTermination: false
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: fitcoach-backup, Value: !Ref AWS::StackName }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Prepares the host; each deploy brings the compose and scripts. Output: /var/log/cloud-init-output.log
          set -euxo pipefail
          BACKUP_BUCKET="${BackupBucket}"
          SWAP_SIZE="${SwapSize}"
          export DEBIAN_FRONTEND=noninteractive

          # Docker Engine >= 25 (healthcheck start_interval) and the Compose plugin.
          apt-get update
          apt-get install -y ca-certificates curl make
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          # Bounded json-file logs: Alloy reads them through the Docker API.
          cat > /etc/docker/daemon.json <<'JSON'
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" }
          }
          JSON
          systemctl enable docker
          systemctl restart docker
          snap install aws-cli --classic

          if ! swapon --show | grep -q /swapfile; then
            fallocate -l "$SWAP_SIZE" /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # Deploy directory: the .env (600 root) is created by hand, the rest comes with each deploy.
          install -d -m 755 -o root -g root /opt/fitcoachia

          # Nightly pg_dump to S3 once the first deploy installs the script; cron's PATH lacks /snap/bin (AWS CLI).
          cat > /etc/cron.d/fitcoach-backup <<CRON
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin
          30 3 * * * root [ -x /opt/fitcoachia/backup-postgres.sh ] && BACKUP_BUCKET=$BACKUP_BUCKET /opt/fitcoachia/backup-postgres.sh >> /var/log/fitcoach-backup.log 2>&1
          CRON

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # deploy.yml: only from the GitHubEnvironment environment of the repository, through SSM (root on the instance).
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub deploy.yml of ${GitHubRepository} on ${AWS::StackName}
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateGitHubOidcProvider, !Ref GitHubOidcProvider, !Ref GitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${BackupBucket.Arn}/deploy/*
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              # GetCommandInvocation has no resource-level permissions.
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: !Sub Daily snapshots of ${AWS::StackName}
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [INSTANCE]
        TargetTags:
          - { Key: fitcoach-backup, Value: !Ref AWS::StackName }
        Schedules:
          - Name: daily
            CopyTags: true
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["03:00"] }
            RetainRule: { Count: !Ref SnapshotRetentionCount }

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Description: DNS A record of the API and Grafana domains.
    Value: !Ref ElasticIp
  BackupBucketName:
    Value: !Ref BackupBucket
  DeployRoleArn:
    Description: GitHub secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
  SessionCommand:
    Description: Shell on the instance through Session Manager.
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${Instance}
