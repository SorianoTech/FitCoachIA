name: fitcoach-prod

services:

  pgvector:
    build:
      context: ./
      dockerfile: Dockerfile-pgVector
    container_name: pgvector
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgvector_volume:/var/lib/postgresql
    networks:
      - fit-coach-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fitcoach" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # fitcoach-db-loader:
  #   build:
  #     context: ./
  #     dockerfile: Dockerfile-db-loader
  #   container_name: fitcoach-db-loader
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./loader/resources:/media:ro
  #   networks:
  #     - fit-coach-net
  #   depends_on:
  #     pgvector:
  #       condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT}:${STANDARD_HTTP_PORT}"
    volumes:
      - pgadmin_data:/root/.pgadmin
    networks:
      - fit-coach-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-O", "-", "http://localhost:${STANDARD_HTTP_PORT}/misc/ping" ]
      interval: 60s
      timeout: 10s
      retries: 5
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  pgadmin_data:
  pgvector_volume:
  fitcoach_prod_pgvector:

networks:
  proxy-network:
    external: true
  fit-coach-net:
    driver: bridge
