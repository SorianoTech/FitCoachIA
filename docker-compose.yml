name: fitcoach-prod

# El nombre de servicio es el alias de red: debe ser unico por entorno en proxy-network.
services:
  fitcoach-ia-prod:
    container_name: fitcoach-ia
    restart: unless-stopped
    image: fitcoachia/fitcoach-app:${VERSION:-latest}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=2)"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
      # Sondeo rapido solo durante el arranque: el despliegue no espera 5 min a ver healthy.
      start_interval: 5s
    env_file:
      - ${FITCOACH_ENV_FILE:-/etc/fitcoachia/prod/.env.prod}
    environment:
      APP_ENV: prod
      database_url: postgresql+asyncpg://${POSTGRES_USER:-fitcoach}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres-prod:5432/${POSTGRES_DB:-fitcoach}
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - proxy-network
  postgres-prod:
    # Nombre fijo: sin el, un rename de servicio crearia un segundo Postgres
    # sobre el mismo volumen en vez de fallar por conflicto de nombre.
    container_name: fitcoach-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-fitcoach}
    volumes:
      - fitcoach-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitcoach} -d ${POSTGRES_DB:-fitcoach}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true

volumes:
  fitcoach-prod-postgres:
