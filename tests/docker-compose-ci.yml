services:
  fitcoach-ia:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: src/Dockerfile
    environment:
      # Dummy values: just enough for the fail-fast startup check to pass.
      - bot_telegram_token=ci-test-token
      - bot_telegram_url=http://ci-telegram-mock:9999
      - bot_telegram_commands=start:Inicia FitCoach
      - log_level=INFO
      - ia_base_url=http://ci-llm-mock:9999
      - ia_token=ci-test-token
      - ia_model=ci-test-model
      - ia_temperature=0.5
      - database_url=postgresql+asyncpg://fitcoach:fitcoach@postgres:5432/fitcoach

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - proxy-network
    ports:
      - 8001:8000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitcoach
      POSTGRES_PASSWORD: fitcoach
      POSTGRES_USER: fitcoach
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach -d fitcoach"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  proxy-network:
    driver: bridge
