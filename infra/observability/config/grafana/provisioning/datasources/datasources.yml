apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"(\w+)"'
          name: TraceID
          url: "$${__value.raw}"
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
      serviceMap:
        datasourceUid: prometheus
    editable: false

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${FITCOACH_POSTGRES_DB}
    user: ${FITCOACH_POSTGRES_USER}
    uid: fitcoach-postgres
    secureJsonData:
      password: ${FITCOACH_POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    # token_usage vive en la misma base que la app: consultas SQL directas
    # (tokens/coste por telegram_user_id o por agente) sin pasar por Loki/Tempo.
    editable: false
