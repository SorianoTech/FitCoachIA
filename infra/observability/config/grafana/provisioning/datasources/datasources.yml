apiVersion: 1

# Datasource previo, unico, sustituido por "PostgreSQL Dev"/"PostgreSQL Prod"
# (ver seccion 8 de docs/observabilidad.md sobre convivencia dev/prod).
deleteDatasources:
  - name: PostgreSQL
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
      serviceMap:
        datasourceUid: prometheus
    editable: false

  - name: PostgreSQL Dev
    type: postgres
    access: proxy
    url: postgres-dev:5432
    database: ${FITCOACH_POSTGRES_DEV_DB}
    user: ${FITCOACH_POSTGRES_DEV_USER}
    uid: fitcoach-postgres-dev
    secureJsonData:
      password: ${FITCOACH_POSTGRES_DEV_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    # token_usage vive en la misma base que la app: consultas SQL directas
    # (tokens/coste por telegram_user_id o por agente) sin pasar por Loki/Tempo.
    editable: false

  - name: PostgreSQL Prod
    type: postgres
    access: proxy
    url: postgres-prod:5432
    database: ${FITCOACH_POSTGRES_PROD_DB}
    user: ${FITCOACH_POSTGRES_PROD_USER}
    uid: fitcoach-postgres-prod
    secureJsonData:
      password: ${FITCOACH_POSTGRES_PROD_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    editable: false
