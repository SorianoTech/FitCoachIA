name: fitcoach-observability

# Stack de observabilidad autogestionado, desacoplado del compose de la app.
# La app no depende de que este stack esté levantado (exporta OTLP en modo best-effort).

services:
  grafana:
    image: grafana/grafana:11.3.0
    container_name: fitcoach-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.fitcoach.sergiosoriano.es
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD is required}
      # Credenciales de cada Postgres (docker-compose.dev.yml / docker-compose.yml);
      # Grafana llega a ambos por proxy-network usando los alias postgres-dev/postgres-prod.
      FITCOACH_POSTGRES_DEV_DB: ${FITCOACH_POSTGRES_DEV_DB:-fitcoach}
      FITCOACH_POSTGRES_DEV_USER: ${FITCOACH_POSTGRES_DEV_USER:-fitcoach}
      FITCOACH_POSTGRES_DEV_PASSWORD: ${FITCOACH_POSTGRES_DEV_PASSWORD:?FITCOACH_POSTGRES_DEV_PASSWORD is required}
      FITCOACH_POSTGRES_PROD_DB: ${FITCOACH_POSTGRES_PROD_DB:-fitcoach}
      FITCOACH_POSTGRES_PROD_USER: ${FITCOACH_POSTGRES_PROD_USER:-fitcoach}
      FITCOACH_POSTGRES_PROD_PASSWORD: ${FITCOACH_POSTGRES_PROD_PASSWORD:-changeme}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - fitcoach-observability-grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability
      - proxy-network

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: fitcoach-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver # requerido por metrics_generator de Tempo
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fitcoach-observability-prometheus:/prometheus
    networks:
      - observability

  loki:
    image: grafana/loki:3.3.2
    container_name: fitcoach-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - fitcoach-observability-loki:/loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.6.1
    container_name: fitcoach-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - fitcoach-observability-tempo:/var/tempo
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: fitcoach-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/otel-collector.yml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
    volumes:
      - ./config/otel-collector/otel-collector.yml:/etc/otel-collector/otel-collector.yml:ro
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - observability
      - proxy-network # la app (proxy-network) envía OTLP aquí

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: fitcoach-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Solo lectura; el propio config.alloy filtra para leer unicamente
      # fitcoach-ia/dev-fitcoach-ia, aunque el socket expone todo el host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - observability

networks:
  observability: {}
  proxy-network:
    external: true

volumes:
  fitcoach-observability-grafana:
  fitcoach-observability-prometheus:
  fitcoach-observability-loki:
  fitcoach-observability-tempo:
