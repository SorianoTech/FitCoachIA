AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FitCoachIA on a single EC2 instance: the same Docker Compose stack as the current server
  (app, embedder, PostgreSQL, pgVector, Nginx Proxy Manager and the project observability stack).
  See docs/despliegue-aws-ec2.md.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Network }
        Parameters: [VpcId, SubnetId, SshIngressCidr]
      - Label: { default: Instance }
        Parameters: [ImageId, InstanceType, RootVolumeSize, SwapSize]
      - Label: { default: Deployment }
        Parameters: [DeployUser, DeploySshPublicKey, RepositoryUrl, RepositoryRef]
      - Label: { default: Backups }
        Parameters: [BackupRetentionDays, SnapshotRetentionCount]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the instance (the default VPC is enough).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet of that VPC. Changing it replaces the instance.
  SshIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
    Description: >-
      Source allowed on port 22. deploy.yml connects from GitHub-hosted runners, whose IPs vary.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu Server 24.04 LTS amd64 AMI. Pinned on purpose: changing it replaces the instance.
      Current one: aws ssm get-parameter --name
      /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge, m7i-flex.large, m7i-flex.xlarge]
    Description: t3.large (8 GB) for prod + observability; t3.xlarge (16 GB) to also host dev.
  RootVolumeSize:
    Type: Number
    Default: 60
    MinValue: 40
    Description: Root gp3 volume in GiB (images, PostgreSQL volumes, Prometheus/Loki/Tempo data).
  SwapSize:
    Type: String
    Default: 2G
    AllowedPattern: ^\d+G$
  DeployUser:
    Type: String
    Default: fitcoach
    AllowedPattern: ^[a-z][a-z0-9_-]{0,30}$
    Description: SSH user of deploy.yml (GitHub secret SERVER_USER).
  DeploySshPublicKey:
    Type: String
    AllowedPattern: ^ssh-(ed25519|rsa) .+$
    Description: Public key whose private half is the GitHub secret SERVER_PKEY.
  RepositoryUrl:
    Type: String
    Default: https://github.com/SorianoTech/FitCoachIA.git
  RepositoryRef:
    Type: String
    Default: develop
    Description: Branch or tag cloned to /opt/fitcoachia (pgVector build context, observability, scripts).
  BackupRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
  SnapshotRetentionCount:
    Type: Number
    Default: 7
    MinValue: 1

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FitCoachIA EC2 - HTTPS for Telegram and the Mini App, SSH for deploy.yml
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Telegram webhook and Mini App }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: Telegram webhook and Mini App }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTPS redirect and Lets Encrypt HTTP-01 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0", Description: HTTPS redirect and Lets Encrypt HTTP-01 }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshIngressCidr, Description: deploy.yml over SSH }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-sg" }

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-postgres-dumps
            Status: Enabled
            Prefix: postgres/
            ExpirationInDays: !Ref BackupRetentionDays

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager: shell and port forwarding (NPM admin, Grafana) without opening ports.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: postgres-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${BackupBucket.Arn}/postgres/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      DisableApiTermination: true
      CreditSpecification: { CPUCredits: unlimited }
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            # Survives an accidental replacement: Docker volumes (PostgreSQL, Grafana...) live here.
            DeleteOnTermination: false
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: fitcoach-backup, Value: !Ref AWS::StackName }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Leaves the host like the current server. Output: /var/log/cloud-init-output.log
          set -euxo pipefail
          DEPLOY_USER="${DeployUser}"
          DEPLOY_SSH_PUBKEY="${DeploySshPublicKey}"
          REPO_URL="${RepositoryUrl}"
          REPO_REF="${RepositoryRef}"
          BACKUP_BUCKET="${BackupBucket}"
          SWAP_SIZE="${SwapSize}"
          export DEBIAN_FRONTEND=noninteractive

          # Docker Engine >= 25 (healthcheck start_interval) and the Compose plugin.
          apt-get update
          apt-get install -y ca-certificates curl git make
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          # Bounded json-file logs: Alloy reads them through the Docker API.
          cat > /etc/docker/daemon.json <<'JSON'
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" }
          }
          JSON
          systemctl enable docker
          systemctl restart docker
          snap install aws-cli --classic

          if ! swapon --show | grep -q /swapfile; then
            fallocate -l "$SWAP_SIZE" /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # Deploy user: docker without sudo, sudo only for what reads the root-owned .env.dev.
          id "$DEPLOY_USER" >/dev/null 2>&1 || useradd -m -s /bin/bash "$DEPLOY_USER"
          usermod -aG docker "$DEPLOY_USER"
          install -d -m 700 -o "$DEPLOY_USER" -g "$DEPLOY_USER" "/home/$DEPLOY_USER/.ssh"
          echo "$DEPLOY_SSH_PUBKEY" > "/home/$DEPLOY_USER/.ssh/authorized_keys"
          chown "$DEPLOY_USER:$DEPLOY_USER" "/home/$DEPLOY_USER/.ssh/authorized_keys"
          chmod 600 "/home/$DEPLOY_USER/.ssh/authorized_keys"
          echo "$DEPLOY_USER ALL=(root) NOPASSWD: /usr/bin/make, /usr/bin/test, /bin/ls" > /etc/sudoers.d/fitcoach-deploy
          chmod 0440 /etc/sudoers.d/fitcoach-deploy
          visudo -c
          install -d -m 700 -o root -g root /etc/fitcoachia/dev

          # External networks of the app, pgVector and observability composes.
          for network in proxy-network fitcoach-internal; do
            docker network inspect "$network" >/dev/null 2>&1 || docker network create "$network"
          done

          # Repository: pgVector build context, observability configs and these scripts.
          [ -d /opt/fitcoachia/.git ] || git clone --branch "$REPO_REF" "$REPO_URL" /opt/fitcoachia
          install -m 644 -o "$DEPLOY_USER" -g "$DEPLOY_USER" \
            /opt/fitcoachia/docker-compose.yml /opt/fitcoachia/Makefile "/home/$DEPLOY_USER/"

          # Nightly pg_dump to S3; cron's PATH lacks /snap/bin, where the AWS CLI lives.
          install -m 750 /opt/fitcoachia/infra/aws/ec2/backup-postgres.sh /usr/local/bin/fitcoach-backup
          cat > /etc/cron.d/fitcoach-backup <<CRON
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin
          30 3 * * * root BACKUP_BUCKET=$BACKUP_BUCKET /usr/local/bin/fitcoach-backup >> /var/log/fitcoach-backup.log 2>&1
          CRON

          # Reverse proxy: needs no secrets, so it can start now.
          docker compose -f /opt/fitcoachia/infra/aws/ec2/nginx-proxy-manager.compose.yml up -d

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: !Sub Daily snapshots of ${AWS::StackName}
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [INSTANCE]
        TargetTags:
          - { Key: fitcoach-backup, Value: !Ref AWS::StackName }
        Schedules:
          - Name: daily
            CopyTags: true
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["03:00"] }
            RetainRule: { Count: !Ref SnapshotRetentionCount }

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Description: DNS A record of the API and Grafana domains, and the GitHub secret SERVER_HOST.
    Value: !Ref ElasticIp
  BackupBucketName:
    Value: !Ref BackupBucket
  SessionCommand:
    Description: Shell on the instance through Session Manager.
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${Instance}
