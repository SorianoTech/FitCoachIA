apiVersion: 1

# Datasource previo, unico, sustituido por "PostgreSQL"
# (ver seccion 8 de docs/observabilidad.md sobre convivencia dev/prod).
deleteDatasources:
  - name: PostgreSQL
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: false
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
      serviceMap:
        datasourceUid: prometheus
    editable: false

  # Solo configuramos acceso a la base de datos del entorno en el que se despliega el Stack de observabilidad.
  # No va a ser posible acceder a la base de datos del otro entorno.
  - name: PostgreSQL Relation DB
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    uid: fitcoach-postgres-${DEPLOYMENT_ENVIRONMENT}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    # token_usage vive en la misma base que la app: consultas SQL directas
    # (tokens/coste por telegram_user_id o por agente) sin pasar por Loki/Tempo.
    editable: false
