name: fitcoach-prod

# Los servicios internos comparten una red exclusiva de produccion. Solo la API
# publica se conecta tambien a proxy-network.
services:
  fitcoach-ia-prod:
    container_name: fitcoach-ia
    restart: unless-stopped
    image: fitcoachia/fitcoach-app:${VERSION:-latest}
    ports:
      - "${APP_PORT}:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=2)" ]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
      # Sondeo rapido solo durante el arranque: el despliegue no espera 5 min a ver healthy.
      start_interval: 5s
    env_file:
      # Base del repositorio; el fichero del sistema, si existe, sobreescribe sus claves.
      - path: .env.prod
        required: false
      - path: ${FITCOACH_ENV_FILE:-/etc/fitcoachia/prod/.env.prod}
        required: false
    depends_on:
      postgres-prod:
        condition: service_healthy
      embedder-prod:
        condition: service_healthy
    networks:
      - internal
      - proxy-network

  embedder-prod:
    container_name: fitcoach-embedder
    restart: unless-stopped
    image: fitcoachia/embedder:${VERSION:-latest}
    env_file:
      # Base del repositorio; el fichero del sistema, si existe, sobreescribe sus claves.
      - path: .env.prod
        required: false
      - path: ${FITCOACH_ENV_FILE:-/etc/fitcoachia/prod/.env.prod}
        required: false
    healthcheck:
      # /health solo responde 200 cuando el modelo esta cargado en memoria.
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health',timeout=2)" ]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    networks:
      - internal

  postgres-prod:
    # Nombre fijo: sin el, un rename de servicio crearia un segundo Postgres
    # sobre el mismo volumen en vez de fallar por conflicto de nombre.
    container_name: fitcoach-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      # Base del repositorio; el fichero del sistema, si existe, sobreescribe sus claves.
      - path: .env.prod
        required: false
      - path: ${FITCOACH_ENV_FILE:-/etc/fitcoachia/prod/.env.prod}
        required: false
    volumes:
      - fitcoach-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitcoach} -d ${POSTGRES_DB:-fitcoach}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  pgadmin-prod:
    image: dpage/pgadmin4
    restart: unless-stopped
    container_name: pgadmin4-prod
    env_file:
      # Base del repositorio; el fichero del sistema, si existe, sobreescribe sus claves.
      - path: .env.prod
        required: false
      - path: ${FITCOACH_ENV_FILE:-/etc/fitcoachia/prod/.env.prod}
        required: false
    volumes:
      - pgadmin-prod_data:/root/.pgadmin
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "wget", "-O", "-", "http://localhost:${STANDARD_HTTP_PORT}/misc/ping" ]
      interval: 60s
      timeout: 10s
      retries: 5
    depends_on:
      postgres-prod:
        condition: service_healthy

networks:
  internal:
    name: fitcoach-prod-internal
    external: true
  proxy-network:
    external: true

volumes:
  fitcoach-prod-postgres:
  pgadmin-prod_data:
