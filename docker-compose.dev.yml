name: fitcoach-dev

# El nombre de servicio es el alias de red: debe ser unico por entorno en proxy-network.
services:
  fitcoach-ia-dev:
    container_name: dev-fitcoach-ia
    build:
      context: .
      dockerfile: src/Dockerfile
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=2)" ]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
      # Sondeo rapido solo durante el arranque; en regimen estable basta cada 5 min.
      start_interval: 5s
    env_file:
      # Base del repositorio; el fichero del sistema, si existe, sobreescribe sus claves.
      - path: .env.dev
        required: false
      - path: ${FITCOACH_ENV_FILE:-/etc/fitcoachia/dev/.env.dev}
        required: false
    environment:
      APP_ENV: dev
      ia_skill: ${ia_skill:-interviewer-dev}
      ia_trainer_skill: ${ia_trainer_skill:-trainer-dev}
      database_url: postgresql+asyncpg://${POSTGRES_USER:-fitcoach}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres-dev:5432/${POSTGRES_DB:-fitcoach}
      # pgVector vive en su propio compose (infra/vector-db). Levantalo con `make vector-up`.
      vector_db_url: postgresql+asyncpg://${VECTOR_DB_USER:-fitcoach_ro}:${VECTOR_DB_PASSWORD:-fitcoach_ro_dev}@pgvector:5432/${VECTOR_DB_NAME:-fitcoach}
      embedder_url: http://embedder-dev:8100
    depends_on:
      postgres-dev:
        condition: service_healthy
      embedder-dev:
        condition: service_healthy
    networks:
      - default
      - proxy-network

  postgres-dev:
    container_name: dev-fitcoach-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-fitcoach}
    volumes:
      - fitcoach-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitcoach} -d ${POSTGRES_DB:-fitcoach}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - proxy-network

  embedder-dev:
    container_name: dev-fitcoach-embedder
    build:
      context: infra/embedder
      dockerfile: Dockerfile-embedder
    healthcheck:
      # /health solo responde 200 cuando el modelo esta cargado en memoria.
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health',timeout=2)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    networks:
      - default
      - proxy-network

  adminer-dev:
    container_name: dev-fitcoach-adminer
    image: adminer:4.8.1-standalone
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres-dev
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - default
      - proxy-network

volumes:
  fitcoach-dev-postgres:

networks:
  proxy-network:
    external: true
