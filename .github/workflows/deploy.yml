name: Deploy release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Release version to deploy. Format: X.Y.Z"

  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Release version to deploy. Format: X.Y.Z"
    # Como secrets y no como inputs: un input string no se enmascara en los logs.
    secrets:
      SERVER_HOST:
        required: true
      SERVER_PKEY:
        required: true
      SERVER_USER:
        required: true
      DOCKER_IMAGE_NAME:
        required: true
      ENV_FILE_PATH:
        required: true

env:
  PYTHON_VERSION: "3.12"
  DOCKER_IMAGE_BASE: "${{ secrets.DOCKER_IMAGE_NAME }}"
  CONTAINER_NAME: "fitcoach-ia"
  APP_PORT: "8000"
  DEPLOY_TARGET_DIR: "/home/${{ secrets.SERVER_USER }}"
  SSH_PORT: 22
  ENV_FILE: "${{ secrets.ENV_FILE_PATH }}/.env.prod"

jobs:
  Deploy:
    name: Deploy-to-server
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Componer nombre de imagen
        id: image_version
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version debe tener formato X.Y.Z"
            exit 1
          fi
          IMAGE="${{ env.DOCKER_IMAGE_BASE }}:$VERSION"
          echo "Imagen a desplegar: $IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Los SCRIPT_* corren en el servidor remoto: el env del runner no cruza el SSH.
      - name: deploy
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_PKEY }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ env.SSH_PORT }}
          SOURCE: docker-compose.yml Makefile
          TARGET: ${{ env.DEPLOY_TARGET_DIR }}/
          SCRIPT_BEFORE_REQUIRED: true
          SCRIPT_BEFORE: |
            set -e
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            IMAGE_BASE="${{ env.DOCKER_IMAGE_BASE }}"
            NEW_IMAGE="${{ steps.image_version.outputs.IMAGE }}"
            ENV_FILE="${{ env.ENV_FILE }}"
            ENV_DIR="$(dirname "$ENV_FILE")"

            step() { echo ""; echo "=== $* ==="; }
            log()  { echo "    $*"; }

            step "Contexto"
            log "Servidor:           $(hostname)"
            log "Imagen a desplegar: $NEW_IMAGE"
            log "Contenedor:         $CONTAINER_NAME"
            log "Fichero de entorno: $ENV_FILE"
            log "Espacio libre en /: $(df -h / | awk 'NR==2 {print $4}')"

            step "1/4 Verificar acceso al fichero de entorno"
            if ! sudo -n true 2>/dev/null; then
              log "ERROR: el usuario de despliegue no puede usar 'sudo -n' (falta regla NOPASSWD)"
              exit 1
            fi
            if ! sudo -n test -r "$ENV_FILE"; then
              log "ERROR: $ENV_FILE no existe o no es legible ni con sudo"
              log "Contenido de $ENV_DIR:"
              sudo -n ls -la "$ENV_DIR" 2>/dev/null | sed 's/^/      /' || log "      (no accesible)"
              exit 1
            fi
            log "Fichero de entorno accesible con sudo: $ENV_FILE"

            step "2/4 Estado actual del contenedor"
            CURRENT_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)
            if [ -z "$CURRENT_IMAGE" ]; then
              log "No existe ningún contenedor '$CONTAINER_NAME'"
            else
              log "Contenedor '$CONTAINER_NAME' encontrado"
              log "  imagen actual: $CURRENT_IMAGE"
              log "  estado:        $(docker inspect -f '{{.State.Status}}' "$CONTAINER_NAME")"
            fi

            step "3/4 Imágenes locales de la aplicación (antes del pull)"
            docker images --format '  {{.Repository}}:{{.Tag}}  {{.Size}}  creada {{.CreatedSince}}' \
              | grep "$IMAGE_BASE" || log "Ninguna imagen local de la aplicación"

            step "4/4 Descargar nueva imagen"
            log "docker pull $NEW_IMAGE (con el contenedor anterior aún vivo)"
            docker pull "$NEW_IMAGE"
            log "Descargada: $(docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -F "$NEW_IMAGE" || true)"

          SCRIPT_AFTER_REQUIRED: true
          SCRIPT_AFTER: |
            set -e
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            IMAGE_BASE="${{ env.DOCKER_IMAGE_BASE }}"
            NEW_IMAGE="${{ steps.image_version.outputs.IMAGE }}"
            VERSION="${{ steps.image_version.outputs.VERSION }}"
            DEPLOY_DIR="${{ env.DEPLOY_TARGET_DIR }}"
            ENV_FILE="${{ env.ENV_FILE }}"
            DEPLOY_OK=false

            step() { echo ""; echo "=== $* ==="; }
            log()  { echo "    $*"; }

            step "1/6 Capturar la versión en servicio (artefacto de rollback)"
            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)
            PREV_VERSION=""
            if [ -z "$PREV_IMAGE" ]; then
              log "No hay contenedor en servicio: primer despliegue, sin rollback posible"
            else
              log "En servicio: $PREV_IMAGE"
              CANDIDATE="${PREV_IMAGE##*:}"
              # Exige tag de nuestro repo y presente en local; si no, no hay rollback.
              if [ "$PREV_IMAGE" = "$IMAGE_BASE:$CANDIDATE" ] && docker image inspect "$PREV_IMAGE" >/dev/null 2>&1; then
                PREV_VERSION="$CANDIDATE"
                log "Rollback disponible con VERSION=$PREV_VERSION"
              else
                log "AVISO: $PREV_IMAGE no es una imagen local etiquetada de $IMAGE_BASE -> sin rollback"
              fi
            fi

            step "2/6 Retirar el contenedor en servicio (la imagen se conserva)"
            if [ -n "$PREV_IMAGE" ]; then
              docker rm -f "$CONTAINER_NAME"
              log "Contenedor eliminado; imagen $PREV_IMAGE intacta"
            else
              log "Nada que retirar"
            fi

            step "3/6 Levantar la nueva versión"
            cd "$DEPLOY_DIR"

            log "Imagen:  $NEW_IMAGE"
            log "Comando: sudo -n env VERSION=$VERSION PROD_ENV_FILE=$ENV_FILE make prod-up"
            # sudo solo aquí: es el único comando de la cadena que lee el fichero de secretos.
            if sudo -n env VERSION="$VERSION" PROD_ENV_FILE="$ENV_FILE" make prod-up; then

              log "compose up completado"
              log "Contenedor: $(docker ps -a --filter "name=^${CONTAINER_NAME}$" --format '{{.Names}} | {{.Image}} | {{.Status}}')"

              step "4/6 Verificar arranque (espera inicial 5s + 10 intentos x 5s)"
              sleep 5
              for i in $(seq 1 10); do
                STATUS=$(docker inspect -f '{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo missing)
                HEALTH=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo none)
                RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$CONTAINER_NAME" 2>/dev/null || echo "?")
                log "intento $i/10 -> estado=$STATUS salud=$HEALTH reinicios=$RESTARTS"
                if [ "$HEALTH" = "healthy" ]; then
                  log "Health check OK -> nueva versión operativa"
                  DEPLOY_OK=true
                  break
                fi
                if [ "$HEALTH" = "unhealthy" ]; then
                  log "Docker ha declarado el contenedor unhealthy -> no se sigue esperando"
                  break
                fi
                sleep 5
              done
            else
              log "ERROR: 'make prod-up' ha fallado"
            fi

            if [ "$DEPLOY_OK" != true ]; then
              step "FALLO: $NEW_IMAGE no ha arrancado -> rollback"
              docker logs "$CONTAINER_NAME" --tail 50 2>/dev/null || log "(sin logs: el contenedor no llegó a crearse)"
              docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
              docker rmi "$NEW_IMAGE" || true
              log "Contenedor e imagen nuevos eliminados"
              if [ -z "$PREV_VERSION" ]; then
                log "ERROR: no hay versión anterior que restaurar. El servicio queda caído."
                exit 1
              fi
              log "Restaurando $IMAGE_BASE:$PREV_VERSION"
              if sudo -n env VERSION="$PREV_VERSION" PROD_ENV_FILE="$ENV_FILE" make prod-up; then
                log "ROLLBACK OK: $IMAGE_BASE:$PREV_VERSION de nuevo en servicio"
              else
                log "ERROR CRÍTICO: el rollback también ha fallado. Servicio caído."
              fi
              exit 1
            fi

            step "5/6 Limpiar contenedores huérfanos de '$CONTAINER_NAME'"
            NEW_ID=$(docker inspect -f '{{.Id}}' "$CONTAINER_NAME")
            log "Contenedor en servicio: ${NEW_ID%${NEW_ID#????????????}}"
            ORPHANS=$(docker ps -a --filter "name=^${CONTAINER_NAME}" --format '{{.ID}}|{{.Names}}|{{.Image}}' \
              | grep -v "^${NEW_ID%${NEW_ID#????????????}}|" || true)
            if [ -z "$ORPHANS" ]; then
              log "Sin huérfanos: ningún otro contenedor con ese nombre"
            else
              echo "$ORPHANS" | while IFS='|' read -r id name image; do
                log "Eliminando huérfano: $name ($image, $id)"
                docker rm -f "$id" || true
              done
            fi

            step "6/6 Limpiar imágenes antiguas"
            log "Criterio: repositorio de la app + tag semver X.Y.Z + distinto de $VERSION"
            CANDIDATES=""
            for img in $(docker images --format '{{.Repository}}:{{.Tag}}'); do
              case "$img" in "$IMAGE_BASE":*) ;; *) continue ;; esac
              if [ "$img" = "$NEW_IMAGE" ]; then
                log "conservada (recién desplegada): $img"
                continue
              fi
              if echo "${img##*:}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                CANDIDATES="$CANDIDATES $img"
              else
                log "conservada (tag no semver):     $img"
              fi
            done
            if [ -z "$CANDIDATES" ]; then
              log "No hay imágenes antiguas que eliminar"
            else
              log "Marcadas para eliminar:$CANDIDATES"
              for img in $CANDIDATES; do
                if docker rmi "$img" >/dev/null 2>&1; then
                  log "eliminada:     $img"
                else
                  log "NO eliminada (en uso u otro error): $img"
                fi
              done
            fi

            step "Resultado"
            log "Contenedor $CONTAINER_NAME operativo con $NEW_IMAGE"
            log "Imágenes restantes de la aplicación:"
            docker images --format '      {{.Repository}}:{{.Tag}}  {{.Size}}' | grep "$IMAGE_BASE" || true
            log "Espacio libre en /: $(df -h / | awk 'NR==2 {print $4}')"
