name: Deploy release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Release version to deploy. Format: X.Y.Z"

  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Release version to deploy. Format: X.Y.Z"

# Un solo despliegue a la vez; el que esta en curso nunca se cancela.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PREFIX: "deploy"
  # Cubre pull + prod-up (900 s) y, si falla, el rollback completo.
  SSM_EXECUTION_TIMEOUT: "3600"

jobs:
  Deploy:
    name: Deploy-to-server
    runs-on: ubuntu-latest
    timeout-minutes: 70
    # El rol de AWS solo acepta tokens OIDC de este environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validar formato version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version debe tener formato X.Y.Z"
            exit 1
          fi

      # El compose y el Makefile del tag de la release fijan las imagenes que se despliegan.
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Configurar credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Leer instancia y bucket de la pila
        id: stack
        env:
          STACK_NAME: ${{ secrets.AWS_STACK_NAME }}
        run: |
          set -euo pipefail
          outputs=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output json)
          instance=$(jq -r '.[] | select(.OutputKey == "InstanceId") | .OutputValue' <<< "$outputs")
          bucket=$(jq -r '.[] | select(.OutputKey == "BackupBucketName") | .OutputValue' <<< "$outputs")
          if [ -z "$instance" ] || [ -z "$bucket" ]; then
            echo "ERROR: la pila no expone InstanceId y BackupBucketName"
            exit 1
          fi
          echo "instance-id=$instance" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Subir los ficheros de la release a S3
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          set -euo pipefail
          for f in docker-compose.yml Makefile infra/aws/ec2/backup-postgres.sh infra/aws/ec2/deploy-release.sh; do
            aws s3 cp --only-show-errors "$f" "s3://$BUCKET/$DEPLOY_PREFIX/$VERSION/$(basename "$f")"
            echo "subido: $f"
          done

      # La instancia descarga los ficheros y ejecuta deploy-release.sh como root: sin SSH ni sudo.
      - name: Desplegar en la instancia (SSM)
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance-id }}
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          set -euo pipefail
          params=$(jq -n --arg src "s3://$BUCKET/$DEPLOY_PREFIX/$VERSION/" --arg version "$VERSION" \
            --arg timeout "$SSM_EXECUTION_TIMEOUT" '{
              executionTimeout: [$timeout],
              commands: [
                "set -eu",
                "export PATH=\"$PATH:/snap/bin\"",
                "WORK=$(mktemp -d)",
                "trap '\''rm -rf \"$WORK\"'\'' EXIT",
                ("aws s3 cp --recursive --only-show-errors " + $src + " \"$WORK/\""),
                ("bash \"$WORK/deploy-release.sh\" " + $version + " \"$WORK\"")
              ]}')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "FitCoachIA $VERSION" \
            --parameters "$params" --query Command.CommandId --output text)
          echo "Comando SSM: $command_id"

          # Bucle propio: 'aws ssm wait command-executed' se rinde a los ~100 s.
          deadline=$((SECONDS + SSM_EXECUTION_TIMEOUT + 120))
          status=Pending
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) echo "$(date -u +%T) $status" ;;
              *) break ;;
            esac
          done

          echo "::group::Salida del despliegue"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          errors=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          if [ -n "$errors" ] && [ "$errors" != "None" ]; then
            echo "::group::Errores del despliegue"
            echo "$errors"
            echo "::endgroup::"
          fi

          echo "Estado final: $status"
          [ "$status" = "Success" ]
