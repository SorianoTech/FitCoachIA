name: fitcoach-vector-db

services:

  pgvector:
    build:
      context: ./
      dockerfile: Dockerfile-pgVector
    container_name: pgvector
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgvector_volume:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fitcoach -d fitcoach" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:${STANDARD_HTTP_PORT}"
    volumes:
      - pgadmin_data:/root/.pgadmin
    networks:
      - internal
      - proxy-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-O", "-", "http://localhost:${STANDARD_HTTP_PORT}/misc/ping" ]
      interval: 60s
      timeout: 10s
      retries: 5
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  pgadmin_data:
  pgvector_volume:

networks:
  internal:
    name: fitcoach-internal
    external: true
  proxy-network:
    external: true
