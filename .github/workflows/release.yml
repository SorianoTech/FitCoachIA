name: Generate and deploy release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Release version. Format: X.Y.Z"

# Cada imagen lleva su tag fijado en docker-compose.yml; la app usa la version de la release.
env:
  APP_SERVICE: "fitcoach-ia"

jobs:
  Prepare:
    name: Prepare-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
    # Solo nombres de servicio: GitHub descarta un output que contenga el valor de un secreto, y
    # los nombres de imagen llevan el namespace fitcoachia, que coincide con DOCKER_USER.
    outputs:
      services: ${{ steps.images.outputs.services }}
    steps:
      - name: Validar formato version
        run: |
          if ! [[ "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Formato de versión incorrecta. La versión debe tener formato X.Y.Z"
            exit 1
          fi
          echo "Versión válida"

      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Login necesario para consultar la imagen privada de la app.
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --no-interpolate: lee el compose tal cual, sin resolver variables de entorno.
      - name: Listar imagenes a publicar
        id: images
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --no-interpolate --format json \
            | jq -c --arg root "$PWD" --arg version "$VERSION" -f .github/scripts/compose-images.jq \
            > images.json

          if jq -e 'any(.[]; (.image | contains("$")) or (.image | split("/") | last | contains(":") | not))' \
               images.json > /dev/null; then
            echo "::error::Toda imagen construible necesita un tag fijo en docker-compose.yml"
            jq -r '.[].image' images.json
            exit 1
          fi

          echo "### Imagenes de la release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          pending='[]'
          while read -r entry; do
            service=$(jq -r '.service' <<< "$entry")
            image=$(jq -r '.image' <<< "$entry")
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              if [ "$service" = "$APP_SERVICE" ]; then
                echo "::error::$image ya existe. Aumente la versión de entrada"
                exit 1
              fi
              echo "- \`$image\`: ya publicada, se omite" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$image\`: se construye y publica" >> "$GITHUB_STEP_SUMMARY"
              pending=$(jq -c --arg service "$service" '. + [$service]' <<< "$pending")
            fi
          done < <(jq -c '.[]' images.json)
          echo "services=$pending" >> "$GITHUB_OUTPUT"

  Build:
    name: Build-${{ matrix.service }}
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      # Las imagenes son independientes: un fallo no cancela las demas.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.Prepare.outputs.services) }}
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Imagen, contexto y Dockerfile del servicio, leidos del compose como en Prepare.
      - name: Resolver imagen del servicio
        env:
          VERSION: ${{ github.event.inputs.version }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --no-interpolate --format json \
            | jq -c --arg root "$PWD" --arg version "$VERSION" -f .github/scripts/compose-images.jq \
            | jq -r --arg service "$SERVICE" '.[] | select(.service == $service)
                | "IMAGE=\(.image)", "CONTEXT=\(.context)", "DOCKERFILE=\(.file)"' >> "$GITHUB_ENV"
          grep -q '^IMAGE=' "$GITHUB_ENV" || { echo "::error::$SERVICE no esta en docker-compose.yml"; exit 1; }

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Activar runner docker buildx, mejor que el clasico runner
      - name: Set up Docker runner Buildx
        uses: docker/setup-buildx-action@v4.2.0

      # Construimos la imagen docker sin pushear para validar las vulnerabilidades.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: false
          load: true  # necesario para que trivy inspeccione localmente
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.vendor=SorianoTech
            org.opencontainers.image.licenses=https://github.com/${{ github.repository }}/blob/main/LICENSE.md
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.authors=fitcoachpontia@gmail.com
            org.opencontainers.image.version=${{ github.event.inputs.version }}

      # Analiza la imagen en búsqueda de vulnerabilidades del SO, librerias y secretos expuestos en la imagen
      - name: Container scan (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: HIGH,CRITICAL
          exit-code: 0

      # always(): con exit-code 1 el scan falla justo cuando el informe interesa.
      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

      - name: Push image
        run: docker push "$IMAGE"

  # Solo se crea la release cuando todas las imagenes estan publicadas.
  Release:
    name: Generate-release
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ github.event.inputs.version }}
    steps:
      - name: Generate tag and Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ github.event.inputs.version }}
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          preserve_order: true

  Deploy:
    name: Deploy
    needs: Release
    # deploy.yml necesita id-token para asumir el rol de AWS por OIDC.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.Release.outputs.version }}
    # AWS_DEPLOY_ROLE_ARN, AWS_REGION y AWS_STACK_NAME: los lee deploy.yml directamente.
    secrets: inherit
