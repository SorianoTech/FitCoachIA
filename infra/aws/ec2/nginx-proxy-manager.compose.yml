# Nginx Proxy Manager para la EC2: el mismo proxy que el servidor actual.
# Termina TLS (Let's Encrypt) y reenvia a la API por proxy-network.
# El panel de administracion (81) solo escucha en localhost: usar un tunel SSM o SSH.
# Ver docs/despliegue-aws-ec2.md.
name: nginx-proxy-manager

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.12.3
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network

volumes:
  npm-data:
  npm-letsencrypt:

networks:
  proxy-network:
    external: true
