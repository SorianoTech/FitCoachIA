name: fitcoach-rag-doc

services:

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-doc-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-doc:
    build:
      context: ./
      dockerfile: Dockerfile-rag-doc
    container_name: rag-doc
    env_file:
      - path: .env
        required: false
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:${RAG_PORT:-8200}:8200"
    networks:
      - rag-internal
      - proxy-network
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:

networks:
  rag-internal:
  proxy-network:
    external: true
