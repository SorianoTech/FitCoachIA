name: Deploy release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Release version to deploy. Format: X.Y.Z"

  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Release version to deploy. Format: X.Y.Z"
    # Como secrets y no como inputs: un input string no se enmascara en los logs.
    secrets:
      SERVER_HOST:
        required: true
      SERVER_PKEY:
        required: true
      SERVER_USER:
        required: true

env:
  CONTAINER_NAME: "fitcoach-ia"
  DEPLOY_TARGET_DIR: "/home/${{ secrets.SERVER_USER }}/fitcoachia"
  SSH_PORT: 22

jobs:
  Deploy:
    name: Deploy-to-server
    runs-on: ubuntu-latest
    steps:
      - name: Validar version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version debe tener formato X.Y.Z"
            exit 1
          fi

      # Se despliega el codigo de la version: la imagen se construye en el servidor.
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      # Los SCRIPT_* corren en el servidor remoto: el env del runner no cruza el SSH.
      - name: deploy
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_PKEY }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ env.SSH_PORT }}
          SOURCE: ./
          TARGET: ${{ env.DEPLOY_TARGET_DIR }}/
          EXCLUDE: "/.git/, /.github/, /tests/, /docs/, /evals/, /frontend/node_modules/, /.env*"
          SCRIPT_BEFORE_REQUIRED: true
          SCRIPT_BEFORE: |
            set -e
            mkdir -p "${{ env.DEPLOY_TARGET_DIR }}"
            if ! sudo -n true 2>/dev/null; then
              echo "ERROR: el usuario de despliegue no puede usar 'sudo -n' (falta regla NOPASSWD)"
              exit 1
            fi

          SCRIPT_AFTER_REQUIRED: true
          SCRIPT_AFTER: |
            set -e
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            cd "${{ env.DEPLOY_TARGET_DIR }}"

            echo "=== Construir y levantar la version ${{ inputs.version }} ==="
            # sudo solo aqui: es el unico comando que lee el fichero de secretos.
            sudo -n make up

            echo "=== Verificar arranque (espera inicial 5s + 10 intentos x 5s) ==="
            sleep 5
            for i in $(seq 1 10); do
              HEALTH=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo none)
              echo "intento $i/10 -> salud=$HEALTH"
              if [ "$HEALTH" = "healthy" ]; then
                echo "Health check OK -> version operativa"
                exit 0
              fi
              if [ "$HEALTH" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done

            echo "ERROR: $CONTAINER_NAME no esta healthy. Para volver atras, relanza el deploy con la version anterior."
            docker logs "$CONTAINER_NAME" --tail 50 2>/dev/null || true
            exit 1
